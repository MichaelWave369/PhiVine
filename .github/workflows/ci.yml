name: PhiVine unit checks and sandbox fixture evidence

on:
  push:
  pull_request:

jobs:
  unit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  informational-sandbox-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report optional system backend availability (no package installation)
        shell: bash
        run: |
          if command -v bwrap >/dev/null 2>&1; then
            echo "::notice::Bubblewrap available on this runner; testing only the fixed fixture."
          else
            echo "::notice::Bubblewrap absent. Probe must report HELD; no package install will be attempted."
          fi
      - name: Collect narrow fixture qualification evidence (informational only)
        shell: bash
        timeout-minutes: 1
        run: |
          set +e
          PYTHONPATH=src python -m phivine sandbox-check > sandbox-fixture-report.json
          code=$?
          set -e
          cat sandbox-fixture-report.json
          python - "$code" <<'PY'
          import json
          import sys
          with open("sandbox-fixture-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          code = int(sys.argv[1])
          status = report.get("status", "")
          if code == 0 and status == "FIXTURE_BOUNDARY_OBSERVED_NOT_APP_READY" and report.get("fixture_boundary_passed") is True:
              print("::notice::Narrow disposable fixture observed; application execution remains blocked.")
          elif code == 3 and status.startswith("HELD_") and report.get("fixture_boundary_passed") is False:
              print("::warning::Sandbox fixture HELD; no isolation claim is made for this runner.")
          else:
              sys.exit(f"Unexpected sandbox probe result: exit={code}, status={status}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phivine-r3-fixture-evidence
          path: sandbox-fixture-report.json
          if-no-files-found: warn
