name: PhiVine reciprocal PhiOS advisory + DLL triage contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phios-held-peer-contract:
    name: Current PhiVine -> pinned PhiOS dual HELD contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current PhiVine PR source without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact merged PhiOS Rung 11 readers
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiOS
          ref: 34553a6214b05e5bb6c42665d89621d13f1f0516
          path: .ci-phios
          persist-credentials: false
      - name: Set up common Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PhiOS reader's package dependencies
        run: python -m pip install -e ./.ci-phios
      - name: Exercise real PhiVine CLI and held PhiOS reader
        run: |
          python scripts/verify_phios_peer_contract.py \
            --phios .ci-phios \
            --receipt peer-evidence/phivine-phios-held.json
      - name: Exercise real PhiVine static triage against held PhiOS Rung 11 reader
        run: |
          python scripts/verify_phios_triage_peer.py \
            --phios .ci-phios \
            --receipt peer-evidence/phivine-phios-triage-held.json
      - name: Retain bounded review receipts only (never executable fixtures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phivine-phios-held-peer-contracts
          path: |
            peer-evidence/phivine-phios-held.json
            peer-evidence/phivine-phios-triage-held.json
          retention-days: 14
          if-no-files-found: warn
