[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phivine"
version = "0.7.0a1"
description = "Non-authorizing PhiOS Windows binary advisory handoff and local compatibility evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PhiVine contributors"}]
dependencies = []

[project.scripts]
phivine = "phivine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
