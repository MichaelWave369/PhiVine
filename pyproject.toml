[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phivine"
version = "0.5.0a1"
description = "Advisory Windows compatibility planning, snapshot staging and runner observation for PhiOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PhiVine contributors"}]
dependencies = []

[project.scripts]
phivine = "phivine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
